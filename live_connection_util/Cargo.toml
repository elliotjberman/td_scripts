[package]
name = "live-connection-util"
version = "0.1.0"
edition = "2024"
description = "KeyStep MIDI loop test with independent Moog and Tetra return meters"
default-run = "live-connection-util"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
crossterm = "0.29"
ctrlc = { version = "3", features = ["termination"] }
midir = "0.11"
midly = { version = "0.5.3", default-features = false, features = ["std"] }
rosc = "0.11"
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
